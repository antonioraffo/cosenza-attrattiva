name: cosenzaattrattiva

services:
  db:
    image: imresamu/postgis:17-3.5 # build multi-arch (amd64 + arm64) di postgis/postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosenza}
      POSTGRES_DB: ${POSTGRES_DB:-cosenza}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cosenzaattrattiva.test}
      DATABASE_URL: ${DATABASE_URL:-postgres://cosenza:cosenza@db:5432/cosenza}
      NEXT_PUBLIC_DEMO_TOOLS: ${NEXT_PUBLIC_DEMO_TOOLS:-true}
      # funzioni "wow": attive di default, quelle Google richiedono anche la chiave
      NEXT_PUBLIC_FEATURE_3D: ${NEXT_PUBLIC_FEATURE_3D:-true}
      NEXT_PUBLIC_FLY3D_PROVIDER: ${NEXT_PUBLIC_FLY3D_PROVIDER:-maplibre}
      NEXT_PUBLIC_FEATURE_STREETVIEW: ${NEXT_PUBLIC_FEATURE_STREETVIEW:-true}
      NEXT_PUBLIC_FEATURE_AR: ${NEXT_PUBLIC_FEATURE_AR:-true}
      NEXT_PUBLIC_FEATURE_ASSISTANT: ${NEXT_PUBLIC_FEATURE_ASSISTANT:-true}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next-cache:/app/.next
      - pnpm-store:/pnpm/store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      UPSTREAM: ${UPSTREAM:-app:3000}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      # Porte impostate dal Makefile (HTTP_PORT / HTTPS_PORT); default 80/443.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # ── Profilo "prod": build di produzione dietro lo stesso proxy (make prod-local)
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cosenzaattrattiva.test}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_FEATURE_3D: ${NEXT_PUBLIC_FEATURE_3D:-true}
        NEXT_PUBLIC_FLY3D_PROVIDER: ${NEXT_PUBLIC_FLY3D_PROVIDER:-maplibre}
        NEXT_PUBLIC_FEATURE_STREETVIEW: ${NEXT_PUBLIC_FEATURE_STREETVIEW:-true}
        NEXT_PUBLIC_FEATURE_AR: ${NEXT_PUBLIC_FEATURE_AR:-true}
        NEXT_PUBLIC_FEATURE_ASSISTANT: ${NEXT_PUBLIC_FEATURE_ASSISTANT:-true}
        NEXT_PUBLIC_DEMO_TOOLS: ${NEXT_PUBLIC_DEMO_TOOLS:-true}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cosenza:cosenza@db:5432/cosenza}
    depends_on:
      db:
        condition: service_healthy

  # ── Profilo "tests": Playwright contro https://cosenzaattrattiva.test (via host → Caddy)
  e2e:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    working_dir: /app
    ipc: host
    environment:
      BASE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cosenzaattrattiva.test}
      # la CA mkcert rende verificabile il certificato anche da Node (test TLS)
      NODE_EXTRA_CA_CERTS: /app/docker/certs/rootCA.pem
      CI: "true"
      # password del sito di riferimento vivi-cosenza (solo per scripts/reference)
      REF_PASSWORD: ${REF_PASSWORD:-}
      REF_COOKIE: ${REF_COOKIE:-}
    extra_hosts:
      - "cosenzaattrattiva.test:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "test"]

  # ── Profilo "dns": risolve *.cosenzaattrattiva.test verso l'IP LAN del Mac
  # per i test da smartphone (make dns). Impostare il DNS del telefono su LAN_IP.
  dns:
    profiles: ["dns"]
    image: alpine:3.22
    command: >
      sh -c "apk add --no-cache dnsmasq >/dev/null &&
             exec dnsmasq --keep-in-foreground --log-facility=- --no-resolv
             --server=1.1.1.1 --server=9.9.9.9
             --address=/cosenzaattrattiva.test/$${LAN_IP}"
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
    ports:
      - "53:53/udp"
      - "53:53/tcp"

volumes:
  db-data:
  node_modules:
  next-cache:
  pnpm-store:
  caddy-data:
  caddy-config:
